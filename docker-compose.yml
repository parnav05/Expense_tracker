version: '3.9'

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  expense-net:
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  mysql-data:
    driver: local
  backend-logs:
    driver: local

# ─── Services ─────────────────────────────────────────────────────────────────
services:

  # ── MySQL Database ───────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: expense-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE: ${DB_NAME:-expense_tracker}
      MYSQL_USER: ${DB_USER:-expenseuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-expensepass123}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - expense-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password

  # ── Backend API ───────────────────────────────────────────────────────────────
  backend:
    image: parnav05/expense_tracker_backend:latest
    container_name: expense-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-expense_tracker}
      DB_USER: ${DB_USER:-expenseuser}
      DB_PASSWORD: ${DB_PASSWORD:-expensepass123}
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production_minimum_32_chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "5000:5000"
    volumes:
      - backend-logs:/app/logs
    networks:
      - expense-net
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    image: parnav05/expense_tracker_frontend:latest
    container_name: expense-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - expense-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
