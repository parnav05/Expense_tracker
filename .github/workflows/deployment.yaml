name: deploy to server

on:
  push:
    branches: [dev]

jobs:
  frontend:
    uses: ./.github/workflows/frontend.yaml
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  backend:
    uses: ./.github/workflows/backend.yaml
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  code_test:
    needs: [frontend,backend]
    uses: ./.github/workflows/deploy.yaml


      