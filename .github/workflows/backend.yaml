name: backend

on:
  workflow_dispatch:

jobs:
  secret_scan:
    uses: ./.github/workflows/secret _scan.yaml

  code_quality:
    uses: ./.github/workflows/code_quality.yaml

  code_test:
    uses: ./.github/workflows/test_code.yaml

  Application_build:
    uses: ./.github/workflows/app_build.yaml

  docker_build-push:
    needs: [secret_scan,code_quality,code_test,Application_build]
    uses: ./.github/workflows/docker_build.yaml
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    
