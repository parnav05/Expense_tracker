name: frontend 

on:
  push:
    branches: [ dev ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: checkout code 
        uses: actions/checkout@v4

      - name: node setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: dependency intall 
        run: npm install
        working-directory: ./frontend

      - name: Run linters
        run: npm run lint
        working-directory: ./frontend

      - name: run tests
        run: npm test
        working-directory: ./frontend

      - name: secuurity check
        run: npm audit
        working-directory: ./frontend

      - name: secuurity check
        run: npm audit fix
        working-directory: ./frontend

           


