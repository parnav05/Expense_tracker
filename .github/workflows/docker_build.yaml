name: docker_workflow

on:
  workflow_call:

on:
  workflow_call:
    secrets:
      DOCKERHUB_TOKEN:
        required: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t backend:latest .
        working-directory: ./backend        # ← typo fix: baackend → backend

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend:latest         # ← frontend → backend
          exit-code: 1
          severity: "CRITICAL"
          ignore-unfixed: true

      - name: Push Docker Image
        run: |
          docker tag backend:latest ${{ vars.DOCKERHUB_USERNAME }}/expense_tracker_backend:latest
          docker push ${{ vars.DOCKERHUB_USERNAME }}/expense_tracker_backend:latest